<!doctype html>
<!-- README hero for Career Compass. 1600x560 CSS px; render.mjs captures it at device scale 2.
     ?theme=dark gives the GitHub dark-mode variant. Fonts are served from FONT_DIR by render.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Career Compass banner</title>
<style>
@font-face{font-family:Fraunces;font-style:italic;font-weight:100 900;src:url(fonts/fraunces-italic-latin.woff2) format("woff2")}
@font-face{font-family:Fraunces;font-style:normal;font-weight:100 900;src:url(fonts/fraunces-normal-latin.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:100 800;src:url(fonts/jetbrainsmono-normal-latin.woff2) format("woff2")}
:root{--paper:#f6f2ea;--paper-deep:#ece4d3;--ink:#2b2218;--ink-soft:#5a4a39;--rule:#d9cdb8;--clay:#c2603c;--clay-deep:#8a3b1f;--sage:#5a6b3c;--brass:#a2894f;
  --bg:var(--paper);--text:var(--ink);--soft:var(--ink-soft);--accent:var(--clay-deep);--line:rgba(160,135,100,.20);--margin:rgba(194,96,60,.28);
  --glow:rgba(255,206,140,.55);--glow2:rgba(162,137,79,.16);--vig:rgba(110,80,45,.16);--grain:.10}
body.dark{--bg:#1c1510;--text:#ece1cc;--soft:#bfae90;--accent:#d9905f;--line:rgba(236,225,204,.055);--margin:rgba(217,116,78,.30);
  --glow:rgba(226,160,90,.20);--glow2:rgba(162,137,79,.10);--vig:rgba(0,0,0,.45);--grain:.09}
*{box-sizing:border-box}
html,body{margin:0;width:1600px;height:560px;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:Fraunces,Georgia,serif;position:relative}
.layer{position:absolute;inset:0}
.glow{background:
  radial-gradient(ellipse 820px 520px at 330px -60px,var(--glow),transparent 70%),
  radial-gradient(ellipse 700px 500px at 1250px 330px,var(--glow2),transparent 70%),
  radial-gradient(ellipse 120% 140% at 40% 30%,transparent 55%,var(--vig) 100%)}
body.dark .glow{background:
  radial-gradient(ellipse 900px 560px at 330px -80px,var(--glow),transparent 70%),
  radial-gradient(ellipse 620px 460px at 1250px 290px,rgba(226,170,100,.13),transparent 70%),
  linear-gradient(180deg,#2b2218 0%,#1c1510 100%)}
body.dark .glow::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 120% 140% at 40% 30%,transparent 50%,var(--vig) 100%)}
.rules{background:repeating-linear-gradient(180deg,transparent 0 35px,var(--line) 35px 36px);
  -webkit-mask-image:linear-gradient(90deg,#000 0%,#000 55%,transparent 80%)}
.margin{left:72px;width:1.5px;right:auto;background:var(--margin);-webkit-mask-image:linear-gradient(180deg,transparent,#000 15%,#000 85%,transparent)}
.grain{opacity:var(--grain);mix-blend-mode:multiply}
body.dark .grain{mix-blend-mode:screen}
.copy{position:absolute;left:124px;top:0;bottom:0;width:860px;display:flex;flex-direction:column;justify-content:center}
.kicker{font-family:"JetBrains Mono",monospace;font-size:17px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
  display:flex;align-items:center;gap:16px;margin:0 0 22px}
.kicker svg{flex:none}
body.dark .mk{stroke:rgba(236,225,204,.35);stroke-width:1}
h1{margin:0;font-style:italic;font-weight:380;font-variation-settings:"opsz" 144;font-size:134px;line-height:.98;letter-spacing:-.02em;margin-left:-6px}
h1 .c{color:var(--clay)}
body.dark h1 .c{color:#d9744e}
.tag{margin:26px 0 0;font-size:38px;line-height:1.22;font-weight:400;font-variation-settings:"opsz" 48;color:var(--text);letter-spacing:-.005em}
.tag i{font-style:italic;font-variation-settings:"opsz" 72}
.foot{margin-top:30px;font-family:"JetBrains Mono",monospace;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);display:flex;gap:14px;align-items:center}
.foot .dot{width:5px;height:5px;border-radius:50%;background:var(--brass)}
.dial{position:absolute;left:1000px;top:0;width:600px;height:560px}
</style>
</head>
<body>
<div class="layer glow"></div>
<div class="layer rules"></div>
<div class="layer margin"></div>
<svg class="layer grain" width="1600" height="560"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .18  0 0 0 1.4 -.25"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>

<div class="copy">
  <p class="kicker">
    <svg width="26" height="26" viewBox="0 0 32 32"><rect class="mk" x=".5" y=".5" width="31" height="31" rx="7" fill="#2b2218"/><circle cx="16" cy="16" r="10" fill="#c2603c"/><path d="M20.5 10.5 L14.5 17.5 L11.5 21.5 L17.5 14.5 Z" fill="#2b2218"/></svg>
    A Claude plugin · MCP server · MIT
  </p>
  <h1>Career <span class="c">Compass</span></h1>
  <p class="tag">Paste a job posting.<br><i>Get an honest fit verdict.</i></p>
</div>

<svg class="dial" id="dial" viewBox="-290 -290 600 560"></svg>

<script src="compass.js"></script>
<script>
const dark = new URLSearchParams(location.search).get('theme') === 'dark';
if (dark) document.body.classList.add('dark');
drawCompass(document.getElementById('dial'), { r: 182, theme: dark ? 'dark' : 'light', bearing: 44, labelSize: 14.5 });
document.getElementById('dial').setAttribute('viewBox', '-290 -290 600 560');
</script>
</body>
</html>
