name: Rebuild the bundled plugin

# After each npm release, rebuilds benskamps/career-compass-plugin (the bundled Claude
# directory plugin) from the published package with scripts/build-plugin-bundle.mjs, and
# opens a pull request there. Merging that pull request is what sends the new version to
# the Claude directory; nothing here publishes on its own.
#
# Needs one repository secret, PLUGIN_REPO_TOKEN: a fine-grained token scoped to
# benskamps/career-compass-plugin only, with Contents and Pull requests set to read and
# write. This repo's own GITHUB_TOKEN cannot push to another repository.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact career-compass-mcp version to bundle, e.g. 2.9.3"
        required: true

permissions:
  contents: read

jobs:
  rebuild:
    # Only after a release that actually published to npm.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Work out the version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          version="${INPUT_VERSION:-${RUN_TAG#v}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not an exact version: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the plugin repo token is set
        env:
          PLUGIN_REPO_TOKEN: ${{ secrets.PLUGIN_REPO_TOKEN }}
        run: |
          if [ -z "$PLUGIN_REPO_TOKEN" ]; then
            echo "::error::PLUGIN_REPO_TOKEN is not set. See the comment at the top of this workflow."
            exit 1
          fi

      # This repo at the release tag: the build script plus the skill, icon and privacy
      # policy it copies into the plugin.
      - uses: actions/checkout@v5
        with:
          ref: v${{ steps.v.outputs.version }}
          path: mcp

      # The script is taken from the default branch, so a release tagged before it existed
      # can still be bundled.
      - name: Use the current build script
        run: |
          git -C mcp fetch --quiet --depth 1 origin "${{ github.event.repository.default_branch }}"
          git -C mcp show FETCH_HEAD:scripts/build-plugin-bundle.mjs > mcp/scripts/build-plugin-bundle.mjs

      - uses: actions/checkout@v5
        with:
          repository: benskamps/career-compass-plugin
          token: ${{ secrets.PLUGIN_REPO_TOKEN }}
          path: plugin

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      # esbuild only traces which files the server loads; see the script's header.
      - name: Install esbuild
        working-directory: mcp/scripts
        run: npm i --prefix . --no-save --no-package-lock --no-audit --no-fund esbuild@0.28.2

      - name: Build the bundle
        working-directory: plugin
        env:
          CC_SOURCE_DIR: ${{ github.workspace }}/mcp
        run: node ../mcp/scripts/build-plugin-bundle.mjs "${{ steps.v.outputs.version }}"

      - name: Smoke-test the bundled server
        working-directory: plugin
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | HOME="$RUNNER_TEMP" timeout 20 node server/build/src/index.js > "$RUNNER_TEMP/out.jsonl" || true
          count=$(grep '"id":2' "$RUNNER_TEMP/out.jsonl" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).result.tools.length))')
          echo "tools: $count"
          test "$count" -eq 18

      - name: Open a pull request on the plugin repo
        working-directory: plugin
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_REPO_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Plugin repo already matches $VERSION; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "bundle/v$VERSION"
          git add -A
          git commit -m "Bundle career-compass-mcp $VERSION"
          git push -u origin "bundle/v$VERSION"
          gh pr create --repo benskamps/career-compass-plugin --title "Bundle career-compass-mcp $VERSION" \
            --body "Rebuilt server/ from career-compass-mcp@$VERSION on npm with scripts/build-plugin-bundle.mjs from career-compass-mcp. See BUNDLE.md."
