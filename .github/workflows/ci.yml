name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two jobs, because the repository has two halves and a green that covers one of
# them is the defect this file used to have. CI built and tested the MCP server
# only, with a comment saying the dashboard build was "intentionally skipped" —
# and the dashboard was the half holding the loopback guard's absence and the
# only write path outside the MCP server. "Dev-only" describes distribution, not
# risk. See docs/architecture-audit.md, finding P1.

jobs:
  mcp:
    name: MCP build + tests + leak guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build MCP (tsc)
        run: npm run build:mcp

      - name: Run MCP tests
        run: npm run test:mcp

      # `npm pack --dry-run` against the files allowlist. Does not need the
      # dashboard built — the dashboard is deliberately not published.
      - name: Run npm-pack leak guard
        run: npm run pack:guard

  dashboard:
    name: Dashboard build + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The dashboard has its own lockfile and imports the MCP sources through
      # the @shared alias, so both installs are needed.
      - name: Install dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Run dashboard tests
        run: npx vitest run
        working-directory: dashboard

      # Build the dashboard the way users actually run it: `build:dashboard`
      # runs `next build` AND stages the standalone output (scripts/stage-
      # standalone.mjs copies .next/static + public/ into the standalone tree).
      # A bare `next build` compiles fine and produces a server that returns 200
      # for every route while serving no CSS or JS — so CI passing on `next
      # build` alone was green over the exact defect that shipped. The script
      # cd's into dashboard/ itself, so this runs from the repo root.
      - name: Build dashboard (build:dashboard = next build + stage standalone)
        run: npm run build:dashboard

      # Assert the staging actually happened. `output: "standalone"` does not
      # copy .next/static; if stage-standalone.mjs were dropped from
      # build:dashboard, this file would be absent and the standalone server
      # would serve stylesheet-less pages. Fail loudly here instead.
      - name: Assert standalone build was staged (CSS/JS present)
        run: |
          staged="dashboard/.next/standalone/dashboard/.next/static"
          if [ ! -d "$staged" ]; then
            echo "::error::Standalone build was not staged: $staged is missing."
            echo "The dashboard would serve HTML with no CSS or JS. Did build:dashboard still run scripts/stage-standalone.mjs?"
            exit 1
          fi
          echo "Staged static assets present at $staged"
